name: Test code functionality

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: topobank-test
        ports:
          - 5432:5432

    env:
      USE_DOCKER: no
      DJANGO_SETTINGS_MODULE: test_settings
      DATABASE_URL: postgres://postgres:secret@localhost/topobank-test
      STORAGE_BACKEND: storages.backends.s3boto3.S3Boto3Storage
      TOPOBANK_UPLOAD_METHOD: ${{ matrix.upload-method }}
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret12
      AWS_STORAGE_BUCKET_NAME: topobank-test
      AWS_S3_ENDPOINT_URL: http://localhost:9000
      AWS_DEFAULT_REGION: us-east-1

    strategy:
      matrix:
        python-version: ['3.10']
        # `get_upload_instructions` hands the client a presigned POST policy or
        # a presigned PUT URL depending on this, and the tests upload through
        # whichever it gets, so both are worth exercising.
        upload-method: ['POST', 'PUT']

    steps:
    # SeaweedFS is started before the checkout so that it boots while the source
    # code is checked out and the dependencies are installed. Readiness is
    # checked in the "Create bucket" step below.
    - name: Start SeaweedFS
      run: |
        # The S3 gateway picks up AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY and
        # creates a matching admin identity, so no `-s3.config` file is needed
        # here (unlike in the development stack).
        # The image is pinned so that a CI failure means our code changed, not
        # that SeaweedFS released a new version overnight.
        docker run -d \
          --name seaweedfs \
          -p 9000:9000 \
          -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
          chrislusf/seaweedfs:4.41 \
          server -filer -s3 -s3.port=9000

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up python3 ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: |
        pip install --upgrade pip
        pip install \
          git+https://github.com/ContactEngineering/topobank.git \
          git+https://github.com/ContactEngineering/topobank-orcid.git \
          .[dev]

    # Uses the boto3 that ships with the project instead of a separately
    # downloaded S3 client.
    - name: Create bucket
      run: |
        python - <<'EOF'
        import os
        import time

        import boto3

        s3 = boto3.client("s3", endpoint_url=os.environ["AWS_S3_ENDPOINT_URL"])
        bucket = os.environ["AWS_STORAGE_BUCKET_NAME"]

        # SeaweedFS reports an existing bucket as `BucketAlreadyOwnedByYou`,
        # but other S3 implementations use `BucketAlreadyExists`. Either way
        # the bucket is there, which is all we are after.
        already_exists = (
            s3.exceptions.BucketAlreadyOwnedByYou,
            s3.exceptions.BucketAlreadyExists,
        )

        error = None
        for attempt in range(30):
            try:
                s3.create_bucket(Bucket=bucket)
                break
            except already_exists:
                break
            except Exception as exc:
                error = exc
                print(f"Attempt {attempt + 1}: SeaweedFS not ready yet, waiting...")
                time.sleep(2)
        else:
            raise SystemExit(f"SeaweedFS did not become ready: {error}")

        print(f"Bucket '{bucket}' is ready.")
        EOF

    - name: Test
      run: pytest -s -v -rsx --cov=topobank_rest_api --cov-report=term --cov-report=xml

    - name: Publish coverage summary
      if: always()
      run: |
        if [ -f .coverage ]; then
          echo "## Code coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown --sort=cover >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
        if-no-files-found: ignore
